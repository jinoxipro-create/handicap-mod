
name: Build Minecraft Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: handicap-mod/handicap-mod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Build mod with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: handicap-mod-jar
          path: handicap-mod/handicap-mod/build/libs/*.jar
          if-no-files-found: error
