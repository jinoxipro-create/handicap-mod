
name: Build Minecraft Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Compiler le mod
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Récupérer le fichier JAR
        uses: actions/upload-artifact@v4
        with:
          name: handicap-mod
          path: build/libs/*.jar
